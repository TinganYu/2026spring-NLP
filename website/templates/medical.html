<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{url_for('static', filename='css/new_style.css')}}">
    </head>
    <body>
        <!-- 頂部的排 -->
        <div class="row" id="top-row">
            <!--<img>
            <h1></h1>-->
            <!-- tab切換紐 -->
            <div class="row" style="grid-column: 2; justify-self: center;">
                <button class="tab select" id="medical-btn">醫療囑咐</button>
                <button class="tab" id="diary-btn">情緒日記</button>
                <button class="tab" id="graph-btn">健康趨勢</button>
            </div>
        </div>
        <!-- 頁面主體 -->
        <div class="row" id="main">
            <!-- 左欄 -->
            <div class="column" style="width: 25%;">
                <div class="row">
                    <img>
                    <h2>醫囑錄入</h2>
                </div>
                <h4>使用語音上傳 (.mp3)</h4>
                <button class="btn" id="upload-mp3">點擊上傳臨床語音檔</button>
                <h4>或手動輸入醫囑內容</h4>
                <textarea id="message" name="message" placeholder="請輸入文字……"></textarea> 
                <div class="row">
                    <button class="btn" id="translate">翻譯</button>
                    <button class="btn select" id="analyze">執行安全解析</button>
                </div>
            </div>
            
            <!-- 結果顯示頁面 -->
            <div class="column" style="left: 27%; background: #F1F5F9; width: 75%;">
                <div class="float-row">
                    <h2 style=" display: inline;">目標翻譯語言：</h2>
                    <button class="btn language-btn select" id="chinese">繁體中文</button>
                    <button class="btn language-btn" id="vietnamese">Tiếng Việ</button>
                    <button class="btn language-btn" id="indonesian">Bahasa Indonesia</button>
                </div>
            </div>
        </div>

        <script src="//unpkg.com/jquery"></script>
        <script src="{{url_for('static', filename='js/main.js')}}"></script>
    </body>
</html>
