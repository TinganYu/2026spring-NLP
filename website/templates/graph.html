<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{url_for('static', filename='css/new_style.css')}}">
    </head>
    <body style="background: #ebf0f6; ">

        <!-- 頂部的排 -->
        <div class="row" id="top-row">
            <!-- tab切換紐 -->
            <div class="row" style="grid-column: 2; justify-self: center;">
                <button class="tab" id="medical-btn">醫療囑咐</button>
                <button class="tab" id="diary-btn">情緒日記</button>
                <button class="tab select" id="graph-btn">健康趨勢</button>
            </div>
        </div>

        <div class="main-column" id="main" style="width:100%; overflow-y: auto;">
            <!-- AI summary -->
            <div id="ai-summary">
                <h3>AI智慧建議</h3><br>
                <p id="ai-summary-content"></p>
            </div>

            <!-- 重點資料顯示列 -->
            <div class="row" id="graph-main-row" style="gap: 20px;">
                <div class="float-row" id="time-range" style="width:25%;">
                    <h4>月回顧</h4>
                </div>
                <div class="float-row" id="most-emotion" style="width:25%;">
                    <h4>整體情緒</h4>
                </div>
                <div class="float-row" id="trend" style="width:25%;">
                    <h4>情緒趨勢走向</h4>
                </div>
                <div class="float-row" id="most-symptom" style="width:25%;">
                    <h4>首要困擾症狀</h4>
                </div>
            </div>
            
            <!-- 時間v.s.情緒指數 折線圖-->
            <div class="float-row column">
                <h2>
                    <div class="dash"></div>
                    情緒波動曲線
                </h2>
                <div class="chart-container">
                    <canvas id="emotion_line_chart"></canvas>
                </div>
            </div>

            <!-- 症狀/用藥次數 柱狀圖-->
            <div class="row" style="height: 25vw; gap: 20px;">
                <div class="float-row column" style="width: 50%; padding-bottom: 40px;">
                    <h2>
                        <div class="dash"></div>
                        症狀次數統計
                    </h2>
                    <canvas id="symptom_frequency_chart"></canvas>
                </div>
                <div class="float-row column" style="width: 50%; padding-bottom: 40px;">
                    <h2>
                        <div class="dash"></div>
                        用藥次數統計
                    </h2>
                    <canvas id="medication_frequency_chart"></canvas>
                </div>
            </div>

            <!-- 情緒v.s.症狀 正負柱狀圖-->
            <div class="float-row column">
                <h2>
                    <div class="dash"></div>
                    情緒與症狀共現分析
                </h2>
                <div class="chart-container">
                    <canvas id="cooccurrence_chart"></canvas>
                </div>
            </div>

            <div style="height: 50px;"></div>
        </div>

        <script src="//unpkg.com/jquery"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="{{url_for('static', filename='js/graph.js')}}"></script>
        <script src="{{url_for('static', filename='js/tab.js')}}"></script>
    </body>
</html>
